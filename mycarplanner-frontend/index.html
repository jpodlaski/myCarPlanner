<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Book and track service for your Hussarya: add your car, choose a drop-off time and follow the work through to the invoice."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>myCarPlanner – Hussarya Service</title>
    <script>
      // Apply the theme before first paint. Key must match src/theme/theme.js.
      (function () {
        try {
          var stored = localStorage.getItem("mycarplanner_theme");
          var theme = stored === "light" || stored === "dark" ? stored : "light";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/img/logo-emblem.png" />
  </head>
  <body>
    <noscript>
      <p>myCarPlanner needs JavaScript to book and track service. Please enable it and reload.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
