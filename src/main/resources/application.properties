spring.datasource.url=jdbc:postgresql://localhost:5432/mycarplanner_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway owns the schema (SQL migrations). Hibernate only validates entities match the DB —
# never auto-creates/alters tables (safer than ddl-auto=update in a real project).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Prevents Hibernate from keeping the session open during view/JSON rendering (classic LazyInit trap).
# Repositories that return graphs for the API therefore use JOIN FETCH (*WithDetails queries).
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.mail.host=${MAIL_HOST:mailhog}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=${MAIL_FROM:noreply@mycarplanner.local}
app.email-renderer.url=${EMAIL_RENDERER_URL:http://localhost:3000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.account-token.password-reset-ttl-seconds=${APP_PASSWORD_RESET_TTL_SECONDS:3600}
app.account-token.email-verification-ttl-seconds=${APP_EMAIL_VERIFICATION_TTL_SECONDS:86400}

# HMAC secret for JWT signing (override in production via APP_JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET:mycarplanner-dev-jwt-secret-change-me-32chars-min}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Redis (used for rate-limit counters). Docker Compose overrides host via SPRING_DATA_REDIS_HOST.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# Short timeouts matter: when Redis is down the limiter fails open, and without these every
# request would block on the default Lettuce timeout before being allowed through.
spring.data.redis.connect-timeout=300ms
spring.data.redis.timeout=300ms

# Rate limiting ---------------------------------------------------------------
# Set to false in tests or if Redis is temporarily unavailable.
app.rate-limit.enabled=true
# When Redis fails and fail-open is true, requests are allowed (safe default).
app.rate-limit.fail-open=true
# Uncomment and set when running behind a trusted reverse proxy, e.g. X-Real-Ip
# app.rate-limit.trusted-header=X-Real-Ip

# Fallback bucket for anything no explicit rule matches. It is shared across all such endpoints
# for one caller, so it must stay well above what a normal dashboard session generates.
# Property is "default-limit" because "default" is a Java keyword and cannot be bound.
app.rate-limit.default-limit.max-requests=600
app.rate-limit.default-limit.window-seconds=60

# "methods" and "roles" are collections, so each entry needs its own index.
# Public auth endpoints: these can be abused for brute-force / email spam.
app.rate-limit.rules[0].path=/auth/login
app.rate-limit.rules[0].methods[0]=POST
app.rate-limit.rules[0].roles[0]=ANONYMOUS
app.rate-limit.rules[0].max-requests=10
app.rate-limit.rules[0].window-seconds=60

app.rate-limit.rules[1].path=/auth/employee-login
app.rate-limit.rules[1].methods[0]=POST
app.rate-limit.rules[1].roles[0]=ANONYMOUS
app.rate-limit.rules[1].max-requests=10
app.rate-limit.rules[1].window-seconds=60

app.rate-limit.rules[2].path=/auth/register
app.rate-limit.rules[2].methods[0]=POST
app.rate-limit.rules[2].roles[0]=ANONYMOUS
app.rate-limit.rules[2].max-requests=5
app.rate-limit.rules[2].window-seconds=60

app.rate-limit.rules[3].path=/auth/forgot-password
app.rate-limit.rules[3].methods[0]=POST
app.rate-limit.rules[3].roles[0]=ANONYMOUS
app.rate-limit.rules[3].max-requests=5
app.rate-limit.rules[3].window-seconds=60

app.rate-limit.rules[4].path=/auth/resend-verification
app.rate-limit.rules[4].methods[0]=POST
app.rate-limit.rules[4].roles[0]=ANONYMOUS
app.rate-limit.rules[4].max-requests=3
app.rate-limit.rules[4].window-seconds=60

# Public read endpoints.
app.rate-limit.rules[5].path=/hello
app.rate-limit.rules[5].methods[0]=GET
app.rate-limit.rules[5].roles[0]=ANONYMOUS
app.rate-limit.rules[5].roles[1]=AUTHENTICATED
app.rate-limit.rules[5].max-requests=30
app.rate-limit.rules[5].window-seconds=60

app.rate-limit.rules[6].path=/vehicles/catalog
app.rate-limit.rules[6].methods[0]=GET
app.rate-limit.rules[6].roles[0]=ANONYMOUS
app.rate-limit.rules[6].roles[1]=AUTHENTICATED
app.rate-limit.rules[6].max-requests=100
app.rate-limit.rules[6].window-seconds=60

# Client write endpoints.
app.rate-limit.rules[7].path=/bookings
app.rate-limit.rules[7].methods[0]=POST
app.rate-limit.rules[7].roles[0]=CLIENT
app.rate-limit.rules[7].max-requests=10
app.rate-limit.rules[7].window-seconds=60

# Expensive PDF invoice generation.
app.rate-limit.rules[8].path=/bookings/*/invoice
app.rate-limit.rules[8].methods[0]=GET
app.rate-limit.rules[8].roles[0]=CLIENT
app.rate-limit.rules[8].max-requests=10
app.rate-limit.rules[8].window-seconds=60

# Management mutation endpoints.
app.rate-limit.rules[9].path=/admins/**
app.rate-limit.rules[9].methods[0]=POST
app.rate-limit.rules[9].methods[1]=PATCH
app.rate-limit.rules[9].methods[2]=DELETE
app.rate-limit.rules[9].roles[0]=MANAGEMENT
app.rate-limit.rules[9].max-requests=20
app.rate-limit.rules[9].window-seconds=60

# Management list reads can be heavy.
app.rate-limit.rules[10].path=/customers/**
app.rate-limit.rules[10].methods[0]=GET
app.rate-limit.rules[10].roles[0]=MANAGEMENT
app.rate-limit.rules[10].max-requests=100
app.rate-limit.rules[10].window-seconds=60

# Transactional email outbox: PENDING rows survive crashes; poller retries with backoff.
app.email-outbox.poll-interval-ms=${APP_EMAIL_OUTBOX_POLL_MS:5000}
app.email-outbox.batch-size=${APP_EMAIL_OUTBOX_BATCH_SIZE:20}
